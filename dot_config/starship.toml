palette = "windows_campbell"
format = "$directory$character"
right_format = "$git_branch$git_commit$git_state$git_status$cmd_duration"
add_newline = true

[palettes.windows_campbell]
black = "#0C0C0C"
red = "#C50F1F"
green = "#13A10E"
yellow = "#C19C00"
blue = "#0037DA"
purple = "#881798"
cyan = "#3A96DD"
white = "#CCCCCC"
bright_black = "#767676"
bright_red = "#E74856"
bright_green = "#16C60C"
bright_yellow = "#F9F1A5"
bright_blue = "#3B78FF"
bright_purple = "#B4009E"
bright_cyan = "#61D6D6"
bright_white = "#F2F2F2"
accent = "#0078D4"

[directory]
style = "bold bright_blue"

[character]
success_symbol = "[❯](bright_blue)"
error_symbol = "[❯](bright_red)"
vimcmd_symbol = "[❮](bright_blue)"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"
truncation_length = 32
truncation_symbol = "…"

[git_commit]
commit_hash_length = 7
format = '[($hash$tag)]($style) '
style = "bold cyan"
only_detached = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = '≠${count}'
stashed = '≡${count}'
deleted = '✘${count}'
renamed = '»${count}'
modified = '●${count}'
typechanged = '~${count}'
staged = '+${count}'
untracked = '?${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ""

[cmd_duration]
min_time = 2000
format = 'took [$duration]($style) '
style = "italic bright_black"
